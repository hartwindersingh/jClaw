[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jclaw-engineering-suite"
version = "0.1.0"
description = "Local-first engineering workspace that complements OpenClaw"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hartwinder Singh"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jclaw = "jclaw_app.app:main"

[tool.setuptools.packages.find]
include = ["jclaw_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
